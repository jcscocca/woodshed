name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  acceptance:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    needs: acceptance
    runs-on: [self-hosted, Linux, thinkpad]
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
      - name: Retain isolated checkouts for fourteen days
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(path.join(process.env.GITHUB_WORKSPACE, 'work'));
          const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
          for (const name of fs.readdirSync(root)) {
            if (!/^[0-9]+-[0-9]+-[A-Za-z0-9_-]+-[0-9]+$/.test(name)) continue;
            const target = path.join(root, name);
            const stat = fs.lstatSync(target);
            if (!stat.isDirectory() || stat.isSymbolicLink() || stat.mtimeMs >= cutoff) continue;
            if (!fs.realpathSync(target).startsWith(root + path.sep)) throw new Error('Unsafe cleanup path');
            fs.rmSync(target, {recursive: true, force: true});
          }
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chromium Unix sockets require a short path, even when _work is deeply nested.
          job_tmp=$(mktemp -d /tmp/gha.XXXXXX)
          echo "CI_JOB_TEMP=$job_tmp" >> "$GITHUB_ENV"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/dist
      - name: Remove this job's Linux temporary directory
        if: always() && runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${CI_JOB_TEMP:-}" in
            /tmp/gha.*) rm -rf -- "$CI_JOB_TEMP" ;;
            '') ;;
            *) echo "Unexpected temporary directory; refusing cleanup" >&2; exit 1 ;;
          esac

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, thinkpad]
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed release and save/reload flow
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.page_url }}
        run: EXPECTED_RELEASE="${GITHUB_SHA:0:12}" node scripts/check-deployment.mjs
      - name: Upload deployed browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/deployed/
          retention-days: 14
